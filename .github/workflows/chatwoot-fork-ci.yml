# =============================================================================
# Chatwoot Fork CI — Автоматична збірка Docker образу
# =============================================================================
#
# Цей workflow призначений для репозиторію NikNikolaenkov/chatwoot
# (форк Chatwoot з додаванням WAVoIP дзвінків).
#
# Як налаштувати секрети Docker Hub у форку Chatwoot:
#
#   1. Перейдіть у репозиторій https://github.com/NikNikolaenkov/chatwoot
#   2. Settings → Secrets and variables → Actions → New repository secret
#   3. Додайте два секрети:
#        DOCKERHUB_USERNAME  — ваш логін на Docker Hub (niknikolaenkov)
#        DOCKERHUB_TOKEN     — персональний токен доступу Docker Hub
#                             (створити: Docker Hub → Account Settings → Security →
#                              New Access Token → Read, Write, Delete)
#
#   Після додавання секретів пуш у гілку whatsapp-call-event-bubble
#   автоматично збиратиме та публікуватиме образ.
#
# Ручне копіювання:
#   Скопіюйте цей файл у .github/workflows/chatwoot-fork-ci.yml
#   у репозиторії NikNikolaenkov/chatwoot.
# =============================================================================

name: Chatwoot Fork CI — Build & Push Docker Image

on:
  push:
    branches:
      - whatsapp-call-event-bubble
  workflow_dispatch:

env:
  IMAGE_NAME: niknikolaenkov/chatwoot
  IMAGE_TAG: develop-custom

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозиторію
        uses: actions/checkout@v5

      - name: Налаштування Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Логін у Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Збірка та публікація Docker образу
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
